name: Destroy CRM Infra

on:
  workflow_dispatch:   # manual trigger only
    inputs:
      environment:
        description: "Which environment to destroy? (dev, staging, prod)"
        required: true
        default: dev

jobs:
  destroy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC
      contents: read    # required to checkout code

    env:
      TF_VAR_environment: ${{ github.event.inputs.environment }}
      AWS_REGION: ap-southeast-1   # match your deployment region

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure AWS creds via OIDC
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.2

      - name: Terraform Init
        working-directory: infra
        run: terraform init -reconfigure
        
      - name: Import IAM role if present
        working-directory: infra
        run: |
          ROLE_NAME="crm-feature2-lambda-role-${TF_VAR_environment}"
          if aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            echo "Role $ROLE_NAME exists in AWS, importing into Terraform state..."
            terraform import -input=false aws_iam_role.lambda_exec $ROLE_NAME || true
          else
            echo "Role $ROLE_NAME does not exist, skipping import."
          fi

      - name: Terraform Destroy
        working-directory: infra
        run: terraform destroy -auto-approve
