name: Deploy CRM Feature 2

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # for OIDC
      contents: read 

    env:
      TF_VAR_environment: dev   # Terraform will pick this up automatically
      AWS_REGION: ap-southeast-1   # or use a GitHub secret if you want per-env flexibility

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package Clients & Accounts Lambdas
        run: |
          cd lambdas
          zip -r clients.zip clients.py requirements.txt
          zip -r accounts.zip accounts.py requirements.txt
          mv clients.zip ../infra/
          mv accounts.zip ../infra/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.2

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: infra
        run: terraform apply -auto-approve tfplan

      # ==============================
      # Capture Terraform outputs
      # ==============================
      - name: Export API URL to JSON
        working-directory: infra
        run: terraform output -json > tf_outputs.json

      - name: Show API URL
        run: cat infra/tf_outputs.json | jq -r .api_url.value

      # ==============================
      # Write API URL into .env
      # ==============================
      - name: Create .env file for frontend
        run: |
          API_URL=$(cat infra/tf_outputs.json | jq -r .api_url.value)
          echo "VITE_API_URL=$API_URL" > .env
          echo "Generated .env file with API URL: $API_URL"

      - name: Upload .env as artifact
        uses: actions/upload-artifact@v4
        with:
          name: env-file
          path: .env
