name: Database Migration

on:
  workflow_dispatch: # run manually

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # for OIDC
      contents: read 

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-southeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.2

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Export Terraform outputs
        working-directory: infra
        run: terraform output -json > tf_outputs.json

      - name: Fetch Aurora secret from Secrets Manager
        run: |
          CLUSTER_ARN=$(jq -r .aurora_cluster_arn.value infra/tf_outputs.json)
          SECRET_ARN=$(jq -r .aurora_secret_arn.value infra/tf_outputs.json)

          echo "Using Cluster ARN: $CLUSTER_ARN"
          echo "Using Secret ARN: $SECRET_ARN"

          # Get actual secret JSON for debugging/logging
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --query SecretString --output text)

          DB_USER=$(echo "$SECRET_JSON" | jq -r .username)
          DB_PASS=$(echo "$SECRET_JSON" | jq -r .password)

          echo "Fetched DB user: $DB_USER"
          # Don’t echo password for security!
          echo "Fetched DB password: $DB_PASS"

          # Export for later steps
          echo "CLUSTER_ARN=$CLUSTER_ARN" >> $GITHUB_ENV
          echo "SECRET_ARN=$SECRET_ARN" >> $GITHUB_ENV
          echo "DB_USER=$DB_USER" >> $GITHUB_ENV

      - name: Run schema migrations on Aurora
        run: |
          awk 'BEGIN{RS=";";} {gsub(/\n/, " "); if (length($0) > 5) print $0";"}' db/schema.sql |
          while IFS= read -r stmt; do
            echo "Running: $stmt"
            aws rds-data execute-statement \
              --resource-arn "$CLUSTER_ARN" \
              --secret-arn "$SECRET_ARN" \
              --database crm \
              --sql "$stmt"
          done
